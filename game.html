<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | 激情麻将</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <!-- The local service provides the authoritative WebSocket; the patch installs its hijacks before Unity initializes. -->
    <script type="text/javascript" src="offline-patch.js"></script>
    <script type="text/javascript" src="spark-md5.js"></script>

    <script>
        // Stub the QuickSDK global so _init does not crash PlayerLoop recursion when QuickSDK is undefined
        (function(){
          window.QuickSDK = {
            // Real signature: init(productCode, productKey, debug, callback)
            init: function(productCode, productKey, debug, cb){
              console.log('[Mock] QuickSDK.init', productCode, productKey, debug);
              try { setTimeout(function(){ if (typeof cb==='function') cb({ status: true }); }, 50); } catch(e) {}
            },
            // Real signature: login(callback)
            login: function(cb){
              console.log('[Mock] QuickSDK.login');
              try { setTimeout(function(){
                if (typeof cb==='function') cb({
                  status: true,
                  data: { uid: '1790658', token: 'mock-token', username: 'sqi151n3s19' }
                });
              }, 50); } catch(e) {}
            },
            logout: function(cb){ if(typeof cb==='function') cb({code:0}); },
            pay: function(o,cb){ if(typeof cb==='function') cb({code:0}); },
            exit: function(){},
            getUserInfo: function(){ return {uid:'1790658',token:'mock-token'}; },
            getChannelInfo: function(){ return {channelCode:'28503',productCode:'79852572180222061492470865042339'}; },
            setCallback: function(){},
            on: function(){},
            off: function(){},
            config: function(){},
            // The game calls this after a successful login
            uploadGameRoleInfo: function(roleInfo, cb){ try { if(typeof cb==='function') cb({code:0}); } catch(e){} },
            // Other possible callback methods
            reportEvent: function(){}, submitExtraData: function(){}, callNative: function(){},
          };
          // Any undeclared method returns success
          window.QuickSDK = new Proxy(window.QuickSDK, {
            get(t, k) { if (k in t) return t[k]; return function(){ try { if(arguments.length>0 && typeof arguments[arguments.length-1]==='function') arguments[arguments.length-1]({code:0, status:true}); } catch(e){} }; }
          });
          window.H5SDK = window.QuickSDK;
          window.QuickService = new Proxy({}, {
            get(target, prop) {
              if (prop === 'show') return () => {};
              if (prop === 'getServiceUrl') return () => '';
              return () => QuickService;
            }
          });
        })();
    </script>
    
  </head>
  <body style="position: absolute;width:100%; height: 100%;">
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      //var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
      
      // All entry URLs use the international client; its in-game language choice is persisted.
      var buildUrl = "Build_intl";
      var loaderUrl = buildUrl + "/mj-h5.loader.js";
      var config = {
        dataUrl: buildUrl + "/mj-h5.data.unityweb",
        frameworkUrl: buildUrl + "/mj-h5.framework.js.unityweb",
        codeUrl: buildUrl + "/mj-h5.wasm.unityweb",
        symbolsUrl: buildUrl + "/mj-h5.symbols.json.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Mahjong Dream",
        productVersion: "1.1.107211826.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

        var isInPhone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      if (isInPhone) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        config.devicePixelRatio = 2.4;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var gameInstance = null;
      var script = document.createElement("script");
      script.onerror = () => {
        clearInterval(time);
        loadingBar.style.display = "none";
        alert("离线游戏加载失败，请确认已通过 start-game.bat 启动。");
      };
      script.src = loaderUrl;
      var currentProgress = 0;
      var bootingUpTime = performance.now();
      console.time("h5 Startup Time");
      console.timeLog("h5 Startup Time","game html script start");
      script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            if (progress === 1)
            {
              currentProgress =  100;
              progressBarFull.style.width = 100 + "%";

            }
            else {
              currentProgress =  50 * progress;
              progressBarFull.style.width = 50 * progress + "%";
            }
          }).then((unityInstance) => {
            console.timeLog("h5 Startup Time","Create unityInstance done ");
            bootingUpTime = performance.now() - bootingUpTime;
            console.log("h5 Startup Time 2",bootingUpTime);
            gameInstance = unityInstance;
            clearInterval(time);
            progressBarFull.style.width = 100 + "%";
            loadingBar.style.display = "none";
          }).catch((message) => {
            clearInterval(time);
            loadingBar.style.display = "none";
            alert(message);
          });
      };

      var time = setInterval(() => {
        // Progress bar slowly increasing
        if(currentProgress >= 45 && currentProgress < 100){
          currentProgress = currentProgress + 1;
          progressBarFull.style.width = currentProgress + "%";
        }
      }, 50);
      // The international H5SDK needs both offline placeholder parameters, even on a bare game.html URL.
      var launchUrl = new URL(location.href);
      if (!launchUrl.searchParams.has("uid")) launchUrl.searchParams.set("uid", "1");
      if (!launchUrl.searchParams.has("sign")) launchUrl.searchParams.set("sign", "19a5aaae0d826f5ac640a4dbfafb1612");
      history.replaceState(null, "", launchUrl.pathname + launchUrl.search + launchUrl.hash);
      preparePlayerPrefs().then(function () { document.body.appendChild(script); });

      // Seed English only when no language is saved, and accept the offline terms before Unity starts.
      // IDBFS v21 and UnityPrf v1 are the formats used by the bundled Unity client.
      function preparePlayerPrefs() {
        return new Promise(function (done) {
          var url = location.href.split(/[?#]/)[0];
          var directory = "/idbfs/" + SparkMD5.hash(url.substring(0, url.lastIndexOf("/")));
          var prefsPath = directory + "/PlayerPrefs";
          var open = indexedDB.open("/idbfs", 21);
          open.onerror = function () { done(); };
          open.onupgradeneeded = function () {
            var db = open.result;
            var store = db.objectStoreNames.contains("FILE_DATA")
              ? open.transaction.objectStore("FILE_DATA") : db.createObjectStore("FILE_DATA");
            if (!store.indexNames.contains("timestamp")) store.createIndex("timestamp", "timestamp", { unique: false });
          };
          open.onsuccess = function () {
            var db = open.result;
            var tx = db.transaction("FILE_DATA", "readwrite");
            var store = tx.objectStore("FILE_DATA");
            var request = store.get(prefsPath);
            request.onsuccess = function () {
              var file = request.result;
              var before = file ? file.contents : new Uint8Array([85, 110, 105, 116, 121, 80, 114, 102, 0, 0, 1, 0, 0, 0, 16, 0]);
              var contents = setPrefsInt(setPrefsInt(before, "LanguageID", 4, true), "user_terms", 1);
              if (contents === before) return;
              if (!file) {
                var parent = store.get(directory);
                parent.onsuccess = function () {
                  if (!parent.result) store.put({ timestamp: new Date(), mode: 16895 }, directory);
                };
              }
              file = file || { mode: 33206 };
              file.contents = contents;
              file.timestamp = new Date();
              store.put(file, prefsPath);
            };
            tx.oncomplete = tx.onerror = tx.onabort = function () { db.close(); done(); };
          };
        });
      }

      // Extend the existing integer patch without reserializing unrelated preferences.
      function setPrefsInt(bytes, key, value, onlyIfMissing) {
        if (!bytes || bytes.length < 16 || String.fromCharCode.apply(null, bytes.subarray(0, 8)) !== "UnityPrf") return bytes;
        if (new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(8, true) !== 65536) return bytes;
        // Offset 12 is the byte capacity, not an entry count. Repair files created by the old patch.
        if (new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(12, true) < bytes.length) {
          bytes = bytes.slice();
          new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).setUint32(12, 1048576, true);
        }
        outer: for (var i = 17; i + key.length + 5 <= bytes.length; i++) {
          if (bytes[i - 1] !== key.length) continue;
          for (var j = 0; j < key.length; j++) if (bytes[i + j] !== key.charCodeAt(j)) continue outer;
          var at = i + key.length;
          if (bytes[at] !== 0xfe) return bytes;
          var old = bytes[at + 1] | (bytes[at + 2] << 8) | (bytes[at + 3] << 16) | (bytes[at + 4] << 24);
          if (onlyIfMissing || old === value) return bytes;
          var changed = bytes.slice();
          for (var k = 0; k < 4; k++) changed[at + 1 + k] = (value >>> (8 * k)) & 0xff;
          return changed;
        }
        var changed = new Uint8Array(bytes.length + key.length + 6);
        changed.set(bytes);
        var at = bytes.length;
        changed[at++] = key.length;
        for (var j = 0; j < key.length; j++) changed[at++] = key.charCodeAt(j);
        changed[at++] = 0xfe;
        for (var k = 0; k < 4; k++) changed[at++] = (value >>> (8 * k)) & 0xff;
        return changed;
      }

      function receiveOrientationFromUnity(param) {
        console.log("Received game html from Unity: " + param);
        const message = { action: 'receiveOrientationFromUnity', value: param };
        window.parent.postMessage(message , '*');
      }

      
      function getH5BootingUpTime(){
        console.log("h5 get BootingUp Time",bootingUpTime);
        return bootingUpTime;
      }

      function unityContainerResize(){
        document.body.offsetHeight;
        var w =  Math.min(window.innerWidth, document.body.clientWidth),
        h = Math.min(window.innerHeight, document.body.clientHeight),
        ratio = 21/9,
        r = w/h;
        var setW = w, setH = h, setTop = 0, setLeft = 0;
        if(r > ratio){
          setW = h * ratio;
          setLeft = (w - setW) / 2;
        }
        else  if (r >= 1) {
            setW = w;
            setH = h;
        }
        else {
          setH = w;
          setTop = (h - setH) / 2;
        }
        
        console.log("source size window-", window.innerWidth, ":", window.innerHeight, ", body-", document.body.clientWidth, ":", document.body.clientHeight);
        console.log("fianl size ", setLeft, ":", setTop, "-", w, ":", h);
        
        canvas.style.width = (setW || w) + 'px';
        canvas.style.height = (setH || h) + 'px';
        canvas.style.top = (setTop || 0) + 'px';
        canvas.style.left = (setLeft || 0) + 'px';
        
        if (isInPhone) {
            container.style.width = (setW || w) + 'px';
            container.style.height = (setH || h) + 'px';
            container.style.top = (setTop || 0) + 'px';
            container.style.left = (setLeft || 0) + 'px';
        }
      }

      window.addEventListener('message', function(event) {
        if (event.data === 'refreshMethod') {
          unityContainerResize();
        }
      });


      // window.addEventListener('resize',unityContainerResize)
      unityContainerResize()

    </script>
  </body>
</html>
